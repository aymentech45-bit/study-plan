<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Study Plan</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <h1>Medical Study Overview</h1>
      <p class="study-tip">
        Study tip: Review one subject before starting another.
      </p>
      <h4>This are your current modules</h4>

      <ul>
        <li>Cardiology</li>
        <li>Neurology</li>
        <li>Endocrinology</li>
        <li>Rheumatology</li>
        <li>Pediatrics</li>
        <li>Pharmacology</li>
        <li>Oncology</li>
        <li>Nephrology</li>
      </ul>
      <section class="revision-progress">
        <h2>Revision Progress</h2>
        <p id="revision-count">0 of 5 study sessions completed.</p>

        <button type="button" id="complete-session">Complete session</button>
      </section>
    </main>
    <script src="progress.js" defer></script>
  </body>
</html>
